[package]
name = "codex-word-prediction"
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "codex_word_prediction"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
zstd = { workspace = true }

[dev-dependencies]
# Exercise the same JSON feature combination used by the TUI.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tempfile = { workspace = true }
